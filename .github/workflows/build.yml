---
name: Build and optionally publish bootc image

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:
    inputs:
      run_vm_smoke:
        description: 'Run the expensive qcow2 + headless VM smoke test before publishing.'
        required: false
        default: false
        type: boolean
      build_iso:
        description: 'Also build the initial installer ISO after the container image publishes.'
        required: false
        default: false
        type: boolean
      install_image_ref:
        description: 'Full OCI image reference for installer ISO testing. Defaults to this repo and image_tag.'
        required: false
        default: ""
        type: string

env:
  IMAGE_DESC: "Omarchy Quattro bootc candidate image"
  IMAGE_KEYWORDS: "bootc,arch,hyprland,omarchy,immutable"
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "testing"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and accept image
    runs-on: ubuntu-24.04
    outputs:
      image_tag: ${{ steps.build_config.outputs.image_tag }}
      accepted_digest: ${{ steps.accept_vm.outputs.digest }}
      accepted_artifact_id: ${{ steps.accepted_artifact.outputs.artifact-id }}
      metadata_tags: ${{ steps.metadata.outputs.tags }}

    permissions:
      contents: read

    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}"         >> "${GITHUB_ENV}"

      - name: Record build config
        id: build_config
        run: |
          echo "image_tag=${DEFAULT_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Validate contracts
        run: |
          set -euo pipefail
          for test in tests/test-*.sh; do
            bash "$test"
          done

      # Free up space on the runner — Arch images can be large.
      # Uncomment if builds exceed runner disk limits.
      # - name: Maximize build space
      #   uses: ublue-os/remove-unwanted-software@517622d6452028f266b7ba4cc9a123b5f58a6b53 # v7
      #   with:
      #     remove-codeql: true

      - name: Mount BTRFS for podman storage
        id: container-storage-action
        uses: ublue-os/container-storage-action@911baca08baf30c8654933e9e9723cb399892140 # main
        continue-on-error: true
        with:
          target-dir: /var/lib/containers
          mount-opts: compress-force=zstd:2

      - name: Prepare Dagger source-contract execution
        run: |
          bash scripts/ci/dagger-engine.sh >> "$GITHUB_ENV"
          git bundle create "$RUNNER_TEMP/source.bundle" HEAD
      - name: Dagger source contracts (migration parity)
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: v0.20.6
          call: source-contracts --git-bundle=${{ runner.temp }}/source.bundle --source-head=${{ github.event.pull_request.head.sha || github.sha }} --execution-id=${{ github.run_id }}-${{ github.run_attempt }} export --path=${{ runner.temp }}/dagger-source
      - name: Require Dagger source-contract success
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: v0.20.6
          call: check-result --status=${{ runner.temp }}/dagger-source/exit-code
      - name: Retain Dagger source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dagger-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dagger-source
          if-no-files-found: warn

      - name: Get current date
        id: date
        run: |
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Image Metadata
        uses: docker/metadata-action@v5
        id: metadata
        with:
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }}
            type=raw,value=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/${{ github.sha }}/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=NOASSERTION
            io.artifacthub.package.prerelease=true
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Prove immutable bootc foundation before full image build
        env:
          CANDIDATE_ARTIFACT_DIR: ${{ runner.temp }}/omarchy-bootc-lower-stages
        run: timeout --signal=TERM --kill-after=60s 60m ./scripts/ci/candidate-build.sh foundation

      - name: Prove Omarchy package assembly before full image build
        env:
          CANDIDATE_ARTIFACT_DIR: ${{ runner.temp }}/omarchy-bootc-lower-stages
        run: timeout --signal=TERM --kill-after=60s 60m ./scripts/ci/candidate-build.sh assembly

      - name: Prove integration layer before full image build
        env:
          CANDIDATE_ARTIFACT_DIR: ${{ runner.temp }}/omarchy-bootc-lower-stages
        run: timeout --signal=TERM --kill-after=60s 60m ./scripts/ci/candidate-build.sh integration

      - name: Upload lower-stage receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omarchy-bootc-lower-stages-${{ github.sha }}
          path: |
            ${{ runner.temp }}/omarchy-bootc-lower-stages/*.receipt.json
            ${{ runner.temp }}/omarchy-bootc-lower-stages/logs
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30

      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2
        with:
          containerfiles: |
            ./Containerfile
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ env.DEFAULT_TAG }}
          labels: ${{ steps.metadata.outputs.labels }}
          oci: false
      - name: Fatal bootc container lint
        run: podman run --rm --privileged "${IMAGE_NAME}:${DEFAULT_TAG}" bootc container lint --fatal-warnings

      # A main artifact is publishable only after the exact image that will be
      # pushed has installed to disk and completed the hosted runtime checks.
      # Pull requests have the stricter candidate workflow, while a main build
      # must gate publication itself so a later tag cannot hide an untested
      # image.
      - name: Install VM acceptance dependencies
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          sudo apt-get update
          sudo apt-get install -y ovmf qemu-system-x86 qemu-utils sshpass skopeo

      - name: Accept the exact publishable image through a disposable overlay
        id: accept_vm
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          CI_ARTIFACT_DIR: ${{ runner.temp }}/vm-smoke-artifacts
        run: |
          set -euo pipefail
          candidate_dir="$RUNNER_TEMP/publish-candidate"
          mkdir -p "$candidate_dir"
          image="${IMAGE_NAME}:${DEFAULT_TAG}"
          podman save --format=oci-archive "$image" > "$candidate_dir/candidate.oci.tar"
          digest="$(tar -xOf "$candidate_dir/candidate.oci.tar" index.json | jq -er '.manifests[0].digest')"
          image_id="$(tar -xOf "$candidate_dir/candidate.oci.tar" "blobs/sha256/${digest#sha256:}" | jq -er '.config.digest')"
          checksum="$(sha256sum "$candidate_dir/candidate.oci.tar" | cut -d' ' -f1)"
          jq -n --arg head "$(git rev-parse HEAD)" --arg id "$image_id" \
            --arg digest "$digest" --arg checksum "sha256:$checksum" \
            '{source_head:$head, image_id:$id, archive:"candidate.oci.tar",
              manifest_digest:$digest, archive_sha256:$checksum}' \
            > "$candidate_dir/candidate.receipt.json"
          bash scripts/ci/candidate-runtime.sh "$candidate_dir"
          jq -e --arg digest "$digest" '.candidate.oci_manifest_digest == $digest and .acceptance.status == "passed"' "$CI_ARTIFACT_DIR/accepted-candidate.receipt.json" >/dev/null
          cp "$CI_ARTIFACT_DIR/accepted-candidate.receipt.json" "$candidate_dir/accepted-candidate.receipt.json"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Upload VM acceptance artifacts
        if: always() && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@v4
        with:
          name: vm-smoke-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vm-smoke-artifacts
          if-no-files-found: warn

      - name: Retain exact accepted publication artifact
        id: accepted_artifact
        if: success() && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@v4
        with:
          name: omarchy-publish-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/publish-candidate
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Promote accepted manifest and sign
    needs: build_push
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    outputs:
      image_digest: ${{ steps.promote.outputs.digest }}
      image_tag: ${{ needs.build_push.outputs.image_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build_push.outputs.accepted_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/accepted-publication
      - name: Install publisher transport
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends skopeo
      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote accepted archive without manifest conversion
        id: promote
        env:
          EXPECTED_DIGEST: ${{ needs.build_push.outputs.accepted_digest }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/accepted-publication"
          [[ "$(jq -er .manifest_digest "$candidate/candidate.receipt.json")" == "$EXPECTED_DIGEST" ]]
          bash scripts/ci/promote-accepted-image.sh "$candidate" "$candidate/accepted-candidate.receipt.json" \
            "ghcr.io/${GITHUB_REPOSITORY,,}" "$GITHUB_SHA" "accepted-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
        with:
          cosign-release: v2.6.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

      - name: Sign and attest published image digest
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.promote.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "${DIGEST}" =~ ^sha256:[[:xdigit:]]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/build-receipt"
          jq -n \
            --arg source_sha "${SOURCE_SHA}" \
            --arg image "${IMAGE}" \
            --arg oci_manifest_digest "${DIGEST}" \
            --arg acceptance_overlay "hosted-vm-acceptance-passed-before-push" \
            '{schema:"omarchy-bootc.published-image/v1", source_sha:$source_sha,
              image:$image, oci_manifest_digest:$oci_manifest_digest,
              acceptance_overlay:"not-applied", acceptance_evidence:$acceptance_overlay}' \
            > "$RUNNER_TEMP/build-receipt/published-image-receipt.json"
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes \
            --type https://omarchy.org/attestation/published-image-receipt/v1 \
            --predicate "$RUNNER_TEMP/build-receipt/published-image-receipt.json" \
            "${IMAGE}@${DIGEST}"

      - name: Verify signed digest and update tracking channel last
        env:
          SOURCE_SHA: ${{ github.sha }}
          DIGEST: ${{ steps.promote.outputs.digest }}
          METADATA_TAGS: ${{ needs.build_push.outputs.metadata_tags }}
          TRACKING_CHANNEL: ${{ needs.build_push.outputs.image_tag }}
        run: bash scripts/ci/update-accepted-channels.sh "ghcr.io/${GITHUB_REPOSITORY,,}" "$DIGEST" "$TRACKING_CHANNEL"

      - name: Upload signed image receipt
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@v4
        with:
          name: published-image-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/build-receipt/published-image-receipt.json
          if-no-files-found: error
          retention-days: 90

  build_installer_iso:
    name: Build installer ISO
    needs: [publish]
    if: github.event_name == 'workflow_dispatch' && inputs.build_iso

    permissions:
      contents: read
      packages: read

    uses: ./.github/workflows/reusable-build-iso.yml
    with:
      image_tag: ${{ needs.publish.outputs.image_tag }}
      install_image_ref: ${{ inputs.install_image_ref }}
      checkout_ref: ${{ github.sha }}
      upload_artifacts: true
