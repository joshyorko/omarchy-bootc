---
name: Build installer ISO

on:
  workflow_dispatch:
    inputs:
      interactive_test_vm:
        description: 'Export the fixed qualified341dbb8 candidate as an UNSIGNED personal QCOW2, not an ISO'
        type: boolean
        default: false
      image_tag:
        description: Intended tracking stream tag (testing or stable)
        required: false
        default: testing
        type: string
      install_image_ref:
        description: Verified immutable OCI image reference (ghcr.io/<repo>@sha256:...)
        required: true
        type: string
      install_source_sha:
        description: Exact 40-hex Git commit SHA attested by the signed image
        required: true
        type: string
      tracking_image_ref:
        description: Optional mutable tracking stream reference (defaults to ghcr.io/<repo>:<image_tag>)
        required: false
        default: ""
        type: string
      acceptance_artifact_run_id:
        description: 'Test an existing trusted main ISO artifact without rebuilding it (empty builds ISO)'
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-installer-iso:
    if: inputs.acceptance_artifact_run_id == '' && !inputs.interactive_test_vm
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/reusable-build-iso.yml
    with:
      image_tag: ${{ inputs.image_tag }}
      install_image_ref: ${{ inputs.install_image_ref }}
      install_source_sha: ${{ inputs.install_source_sha }}
      tracking_image_ref: ${{ inputs.tracking_image_ref }}
      checkout_ref: ${{ inputs.install_source_sha }}
      upload_artifacts: true

  installer-acceptance:
    if: inputs.acceptance_artifact_run_id != '' && !inputs.interactive_test_vm
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Verify trusted ISO producer before downloading
        id: iso_producer
        env:
          GH_TOKEN: ${{ github.token }}
          ISO_RUN: ${{ inputs.acceptance_artifact_run_id }}
          ISO_SOURCE: ${{ inputs.install_source_sha }}
        run: |
          set -euo pipefail
          [[ "$ISO_RUN" =~ ^[0-9]+$ && "$ISO_SOURCE" =~ ^[a-f0-9]{40}$ ]]
          mkdir -p "$RUNNER_TEMP/iso-install"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ISO_RUN" >"$RUNNER_TEMP/iso-install/producer-run.json"
          jq -e --arg sha "$ISO_SOURCE" '.head_sha == $sha and .head_branch == "main" and .conclusion == "success" and (.path == ".github/workflows/build.yml" or .path == ".github/workflows/build-iso.yml")' "$RUNNER_TEMP/iso-install/producer-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ISO_RUN/jobs?per_page=100" >"$RUNNER_TEMP/iso-install/producer-jobs.json"
          jq -e 'any(.jobs[]; (.name | endswith("Build installer ISO")) and .conclusion == "success")' "$RUNNER_TEMP/iso-install/producer-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ISO_RUN/artifacts?per_page=100" >"$RUNNER_TEMP/iso-install/producer-artifacts.json"
          id=$(jq -er '[.artifacts[] | select(.name == "omarchy-bootc-testing-installer-x86_64" and .expired == false)] | if length == 1 then .[0].id else error("expected one immutable ISO artifact") end' "$RUNNER_TEMP/iso-install/producer-artifacts.json")
          echo "artifact_id=$id" >> "$GITHUB_OUTPUT"
      - name: Prepare hosted KVM tools
        run: |
          bash scripts/ci/prepare-ubuntu-runner.sh
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends xorriso openssl
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
        with:
          cosign-release: v2.6.0
      - name: Verify exact signed image and source
        env:
          INSTALL_IMAGE_REF: ${{ inputs.install_image_ref }}
          INSTALL_SOURCE_SHA: ${{ inputs.install_source_sha }}
        run: bash scripts/ci/verify-published-image-trust.sh "$INSTALL_IMAGE_REF" "$INSTALL_SOURCE_SHA"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.iso_producer.outputs.artifact_id }}
          run-id: ${{ inputs.acceptance_artifact_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/installer-iso
          merge-multiple: true
      - name: Record hosted job identity for screenshot provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.name == "installer-acceptance" and .status == "in_progress") | .id')
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "CI_JOB_ID=$id" >> "$GITHUB_ENV"
      - name: Install the ISO on a blank disk and log into the installed desktop
        env:
          CI_ARTIFACT_DIR: ${{ runner.temp }}/iso-install
          INSTALL_IMAGE_REF: ${{ inputs.install_image_ref }}
          INSTALL_SOURCE_SHA: ${{ inputs.install_source_sha }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" == testing ]]
          cd "$RUNNER_TEMP/installer-iso"
          shopt -s nullglob
          images=(*.iso)
          checksums=(*.iso-CHECKSUM)
          [[ ${#images[@]} == 1 && ${#checksums[@]} == 1 ]]
          sha256sum -c "${checksums[0]}"
          iso="$PWD/${images[0]}"
          cd "$GITHUB_WORKSPACE"
          timeout --kill-after=30s 90m bash scripts/ci/iso-install-acceptance.sh "$iso"
      - name: Retain installer receipts and real PNGs, excluding whole disks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iso-install-${{ inputs.install_source_sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/iso-install/*.json
            ${{ runner.temp }}/iso-install/*.log
            ${{ runner.temp }}/iso-install/*.txt
            ${{ runner.temp }}/iso-install/*.md
            ${{ runner.temp }}/iso-install/screenshots/*.png
            ${{ runner.temp }}/iso-install/screenshots/*.json
          if-no-files-found: warn
          retention-days: 30

  interactive-test-vm:
    if: inputs.interactive_test_vm
    needs: interactive-vm-pending
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Bind the fixed qualified OCI and acceptance receipt to their producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/ci/verify-candidate-producer.py 44768835123 341dbb85351994fad83012e40c5bb894c96d1cb5 "$RUNNER_TEMP/producer.json"
          jq -e '.artifact_id==14647899042' "$RUNNER_TEMP/producer.json"
          gh api repos/joshyorko/omarchy-bootc/actions/artifacts/14649529703 > "$RUNNER_TEMP/accepted-metadata.json"
          jq -e '.id==14649529703 and .expired==false and .workflow_run.id==44768835123 and .workflow_run.head_sha=="341dbb85351994fad83012e40c5bb894c96d1cb5"' "$RUNNER_TEMP/accepted-metadata.json"
          gh api 'repos/joshyorko/omarchy-bootc/actions/runs/44768835123/jobs?per_page=100' > "$RUNNER_TEMP/qualified-jobs.json"
          jq -e 'any(.jobs[]; .id==136417143943 and .conclusion=="success")' "$RUNNER_TEMP/qualified-jobs.json"
      - uses: ublue-os/container-storage-action@911baca08baf30c8654933e9e9723cb399892140
        with:
          target-dir: /var/lib/containers
          mount-opts: compress-force=zstd:2
      - name: Prepare hosted build and KVM tools
        run: bash scripts/ci/prepare-ubuntu-runner.sh
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '14647899042'
          run-id: 44768835123
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/interactive-candidate
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '14649529703'
          run-id: 44768835123
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/accepted
          merge-multiple: true
      - name: Install standalone disk and prove actual UEFI KVM desktop boot
        run: bash scripts/ci/export-interactive-vm.sh
      - name: Upload bootable personal VM only after successful boot and shutdown
        uses: actions/upload-artifact@v4
        with:
          name: omarchy-341dbb8-interactive-x86_64-${{ github.run_id }}
          path: ${{ runner.temp }}/interactive-vm/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Retain bounded failure evidence without an unproven disk
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interactive-vm-failure-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/interactive-vm/*.log
            ${{ runner.temp }}/interactive-vm/*.json
            ${{ runner.temp }}/interactive-vm/*.png
          retention-days: 7
          if-no-files-found: warn

  interactive-vm-pending:
    if: inputs.interactive_test_vm
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Report pending VM proof on exact harness commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f 'context=Disposable interactive QCOW2 proof' \
            -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f 'description=Qualified OCI reuse, UEFI KVM boot and standalone disk export in progress'

  interactive-vm-result:
    if: always() && inputs.interactive_test_vm
    needs: interactive-test-vm
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Report actual VM export outcome
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.interactive-test-vm.result }}
        run: |
          state=failure
          [[ "$RESULT" != success ]] || state=success
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f "state=$state" -f 'context=Disposable interactive QCOW2 proof' \
            -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f "description=Personal VM export $RESULT; inspect actual KVM receipts and download artifact"
