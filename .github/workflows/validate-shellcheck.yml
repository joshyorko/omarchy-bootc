---
name: Validate shell scripts (shellcheck)

on:
  pull_request:
    paths:
      - '**.sh'
      - 'build/**'
      - 'custom/first-boot/**'
  push:
    branches:
      - main
    paths:
      - '**.sh'
      - 'build/**'
      - 'custom/first-boot/**'
  workflow_dispatch:

jobs:
  adoption-filesystem:
    name: Root adoption filesystem confinement
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.sha }}
      - name: Real root filesystem races, ownership and adoption retry fixtures
        run: |
          sudo -n env PYTHONDONTWRITEBYTECODE=1 bash tests/test-adoption-filesystem.sh
          sudo -n env PYTHONDONTWRITEBYTECODE=1 bash tests/test-adoption-resume.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: '.'
          ignore_paths: vendor
          severity: warning
      - name: Verify host runtime lock permissions and serialization
        run: |
          bash tests/test-host-runtime-lock.sh
          sudo -n bash tests/test-host-runtime-lock.sh
          bash tests/test-host-runtime-lock.sh --hosted-root-setup
