---
name: Validate shell scripts (shellcheck)

on:
  pull_request:
    paths:
      - '**.sh'
      - 'build/**'
      - 'custom/first-boot/**'
  push:
    branches:
      - main
    paths:
      - '**.sh'
      - 'build/**'
      - 'custom/first-boot/**'
  workflow_dispatch:

jobs:
  validation-pending:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Report pending source and ISO tooling proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f 'context=ISO tooling and source verification' \
            -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  iso-tooling:
    name: Pinned Titanoboa and Dagger source separation
    if: github.event_name == 'workflow_dispatch'
    needs: validation-pending
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Check real pinned upstream recipe with checksum-pinned Just
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/iso-tools"
          curl -fsSL --retry 3 https://github.com/casey/just/releases/download/1.58.0/just-1.58.0-x86_64-unknown-linux-musl.tar.gz -o "$RUNNER_TEMP/iso-tools/just.tar.gz"
          echo "4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d  $RUNNER_TEMP/iso-tools/just.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/iso-tools/just.tar.gz" -C "$RUNNER_TEMP/iso-tools" just
          export PATH="$RUNNER_TEMP/iso-tools:$PATH"
          gh api 'repos/ublue-os/titanoboa/contents/Justfile?ref=840217d97bd0bc9a52466508c54d8dda5c5ba2fd' --jq .content | base64 -d > "$RUNNER_TEMP/iso-tools/Justfile"
          python3 -B tests/iso-tooling.py "$RUNNER_TEMP/iso-tools/Justfile"
          bash tests/test-iso-receipt.sh
          mkdir -p "$RUNNER_TEMP/iso-source/iso_files"
          cp iso_files/* "$RUNNER_TEMP/iso-source/iso_files/"
          echo '# attested-source-selection-probe' >> "$RUNNER_TEMP/iso-source/iso_files/configure_iso_anaconda.sh.in"
      - name: Prove explicit Dagger source uses the attested hook directory
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: v0.20.6
          verb: call
          args: >-
            --source=${{ runner.temp }}/iso-source
            render-iso-hooks
            --install-image-ref=ghcr.io/joshyorko/omarchy-bootc@sha256:aca01a25953209b1e38b8aa115fe253283153f159f6f28defaede9c528476386
            --tracking-image-ref=ghcr.io/joshyorko/omarchy-bootc:testing
            export --path=${{ runner.temp }}/iso-rendered
      - name: Verify rendered source and immutable install reference
        run: |
          set -euo pipefail
          grep -Fx '# attested-source-selection-probe' "$RUNNER_TEMP/iso-rendered/configure_iso_anaconda.sh"
          grep -F 'ghcr.io/joshyorko/omarchy-bootc@sha256:aca01a25953209b1e38b8aa115fe253283153f159f6f28defaede9c528476386' "$RUNNER_TEMP/iso-rendered/configure_iso_anaconda.sh"
      - name: Check actual ISO builder nested Podman, terminal and mount capabilities
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: v0.20.6
          verb: call
          args: iso-builder-preflight

  adoption-filesystem:
    name: Root adoption filesystem confinement
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.sha }}
      - name: Real root filesystem races, ownership and adoption retry fixtures
        run: |
          sudo -n env PYTHONDONTWRITEBYTECODE=1 bash tests/test-adoption-filesystem.sh
          sudo -n env PYTHONDONTWRITEBYTECODE=1 bash tests/test-adoption-resume.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: '.'
          ignore_paths: vendor
          severity: warning
      - name: Verify host runtime lock permissions and serialization
        run: |
          bash tests/test-host-runtime-lock.sh
          sudo -n bash tests/test-host-runtime-lock.sh
          bash tests/test-host-runtime-lock.sh --hosted-root-setup

  validation-result:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [iso-tooling, adoption-filesystem, shellcheck]
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Report actual source and ISO tooling outcome
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          state=failure
          if jq -e 'all(.[]; .result == "success")' <<<"$RESULTS" >/dev/null; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f "state=$state" -f 'context=ISO tooling and source verification' \
            -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
